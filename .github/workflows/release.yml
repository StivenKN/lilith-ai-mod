name: Release

# Push a tag that matches companion/package.json, e.g. `git tag v0.1.0-beta.1 && git push origin v0.1.0-beta.1`.
# Tags with a "-" (beta, rc) are published as pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tag matches package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} doesn't match package.json version $version" }

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: |
          pnpm typecheck
          bun test

      - name: Warn when the Google client is missing from the repository secrets
        env:
          LILITH_GOOGLE_CLIENT_ID: ${{ secrets.LILITH_GOOGLE_CLIENT_ID }}
          LILITH_GOOGLE_CLIENT_SECRET: ${{ secrets.LILITH_GOOGLE_CLIENT_SECRET }}
        shell: bash
        run: |
          if [ -z "$LILITH_GOOGLE_CLIENT_ID" ] || [ -z "$LILITH_GOOGLE_CLIENT_SECRET" ]; then
            echo "::warning title=Google sign-in missing::LILITH_GOOGLE_CLIENT_ID and LILITH_GOOGLE_CLIENT_SECRET are not both set in the repository secrets, so this release ships without Google sign-in. See docs/GOOGLE.md."
          fi

      - name: Build LilithAICompanion.exe
        # The mod's Google OAuth client (docs/GOOGLE.md). Only the release carries it; CI tests use a mock Google.
        env:
          LILITH_GOOGLE_CLIENT_ID: ${{ secrets.LILITH_GOOGLE_CLIENT_ID }}
          LILITH_GOOGLE_CLIENT_SECRET: ${{ secrets.LILITH_GOOGLE_CLIENT_SECRET }}
        run: bun build.ts

      - name: Setup mode starts and serves the dashboard (what players double-click)
        shell: pwsh
        run: |
          $env:LILITH_AI_DATA_DIR = "$env:RUNNER_TEMP\Elcñor Guz\LilithAICompanion"
          $p = Start-Process -PassThru -FilePath dist/LilithAICompanion.exe -ArgumentList "--no-open"
          $ok = $false
          foreach ($i in 1..20) {
            Start-Sleep -Milliseconds 500
            try { if ((Invoke-WebRequest http://127.0.0.1:47321/api/ping -UseBasicParsing -TimeoutSec 2).Content -match "lilith-ai-companion") { $ok = $true; break } } catch {}
          }
          Get-Content "$env:LILITH_AI_DATA_DIR\logs\lilith-ai.log" -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } else { Write-Host "exited with $($p.ExitCode)" }
          if (-not $ok) { throw "setup mode did not serve the dashboard" }

      - name: Build the game plugin (pinned BepInEx + reference stand-ins, no game needed)
        run: |
          bun scripts/pinned.ts bepinex dist/bepinex
          dotnet build ../plugin/LilithAICompanion.csproj -c Release -p:BepInExDir="${{ github.workspace }}/companion/dist/bepinex" -p:UseReferenceStubs=true

      - name: Plugin bridge against the real exe
        shell: pwsh
        run: |
          $mock = Start-Process -PassThru -NoNewWindow -FilePath bun -ArgumentList "scripts/mock-llm.ts", "11555"
          Start-Sleep -Seconds 2
          dotnet run --project ../plugin/harness -c Release -- dist/LilithAICompanion.exe http://127.0.0.1:11555/v1
          $code = $LASTEXITCODE
          Stop-Process -Id $mock.Id -Force
          exit $code

      - name: Assemble the release zip
        run: bun scripts/release.ts --plugin ../plugin/bin/Release/net6.0/LilithAICompanion.dll

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $zip = "dist/release/LilithAICompanion-$version.zip"
          # The release may already exist (published by hand while this run was queued): refresh it.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
            gh release edit $tag --notes-file dist/release/RELEASE-NOTES.md
            exit $LASTEXITCODE
          }
          $flags = @()
          if ($tag.Contains("-")) { $flags += "--prerelease" }
          gh release create $tag $zip --title "Lilith AI Companion $version" --notes-file dist/release/RELEASE-NOTES.md @flags

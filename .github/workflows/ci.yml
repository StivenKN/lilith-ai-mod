name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    # The mod only runs on Windows, so everything is tested there.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        env:
          LILITH_AI_TEST_INPUT: "1"
        run: bun test

      - name: Build LilithAICompanion.exe
        run: bun build.ts

      - name: Setup mode starts and serves the dashboard (what players double-click)
        shell: pwsh
        run: |
          $env:LILITH_AI_DATA_DIR = "$env:RUNNER_TEMP\Elcñor Guz\LilithAICompanion"
          $p = Start-Process -PassThru -FilePath dist/LilithAICompanion.exe -ArgumentList "--no-open"
          $ok = $false
          foreach ($i in 1..20) {
            Start-Sleep -Milliseconds 500
            try {
              $ping = (Invoke-WebRequest http://127.0.0.1:47321/api/ping -UseBasicParsing -TimeoutSec 2).Content | ConvertFrom-Json
              if ($ping.app -eq "lilith-ai-companion" -and $ping.desktop -eq "ok") { $ok = $true; break }
            } catch {}
          }
          Get-Content "$env:LILITH_AI_DATA_DIR\logs\lilith-ai.log" -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } else { Write-Host "exited with $($p.ExitCode)" }
          if (-not $ok) { throw "setup mode did not serve the dashboard" }

      - name: Build the game plugin (pinned BepInEx + reference stand-ins, no game needed)
        run: |
          bun scripts/pinned.ts bepinex dist/bepinex
          dotnet build ../plugin/LilithAICompanion.csproj -c Release -p:BepInExDir="${{ github.workspace }}/companion/dist/bepinex" -p:UseReferenceStubs=true

      - name: Plugin bridge against the real exe (UTF-8, shutdown, job object)
        shell: pwsh
        run: |
          $mock = Start-Process -PassThru -NoNewWindow -FilePath bun -ArgumentList "scripts/mock-llm.ts", "11555"
          Start-Sleep -Seconds 2
          dotnet run --project ../plugin/harness -c Release -- dist/LilithAICompanion.exe http://127.0.0.1:11555/v1
          $code = $LASTEXITCODE
          Stop-Process -Id $mock.Id -Force
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: LilithAICompanion-build
          path: |
            companion/dist/LilithAICompanion.exe
            plugin/bin/Release/net6.0/LilithAICompanion.dll
